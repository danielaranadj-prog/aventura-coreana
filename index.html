<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0221">
<title>🕹️ BOKA AVENTURA — Extreme Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    background: #0d0221;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
  }
  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: #0d0221;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    flex: 1;
  }

  /* ===== UI SUPERIOR ===== */
  #ui-overlay {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: 700;
    text-shadow: 1px 1px 0 #000, 0 0 8px rgba(0,0,0,0.6);
    pointer-events: none;
    z-index: 10;
    background: linear-gradient(to bottom, rgba(13,2,33,0.7), transparent);
  }
  #ui-overlay span { display: flex; align-items: center; gap: 4px; }

  #menu-button {
    position: absolute;
    top: 42px;
    right: 10px;
    z-index: 15;
    padding: 6px 10px;
    border: 1px solid rgba(255,0,255,.4);
    border-radius: 6px;
    background: rgba(45,27,78,.85);
    color: #ff69b4;
    font: 700 12px 'Segoe UI', system-ui, sans-serif;
    cursor: pointer;
    touch-action: manipulation;
    text-shadow: 0 0 8px rgba(255,105,180,0.5);
  }
  #menu-button:active { background: #4a1a6b; }

  /* ===== CONTROLES MÓVILES ESTILO ARCADE ===== */

  /* Modo móvil: reserva espacio inferior para controles */
  #game-wrapper.mobile-mode {
    padding-bottom: 170px;
  }
  #game-wrapper.mobile-mode canvas {
    flex: 1;
    height: auto;
  }
  #mobile-controls {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    justify-content: space-between;
    align-items: flex-end;
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
    z-index: 999;
    pointer-events: none;
  }

  /* ===== D-PAD ARCADE ===== */
  .dpad {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: auto;
  }
  .dpad-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .dpad-btn {
    width: 54px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto;
    transition: transform 0.06s, box-shadow 0.1s;
    position: relative;
    /* Botón arcade azul/cian con relieve 3D */
    background: radial-gradient(circle at 35% 35%, #4dd0e1 0%, #00bcd4 40%, #00838f 100%);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(0,0,0,0.3),
      0 4px 8px rgba(0,188,212,0.35),
      0 0 15px rgba(0,188,212,0.2);
    color: #fff;
    font-size: 18px;
    font-weight: 900;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .dpad-btn::before {
    content: '';
    position: absolute;
    top: 8%;
    left: 15%;
    width: 35%;
    height: 25%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none;
  }
  .dpad-btn:active {
    transform: scale(0.92) translateY(2px);
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.4),
      inset 0 -1px 2px rgba(255,255,255,0.2),
      0 1px 3px rgba(0,188,212,0.3);
  }
  .dpad-center {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #37474f 0%, #263238 60%, #102027 100%);
    box-shadow:
      inset 0 1px 3px rgba(255,255,255,0.15),
      inset 0 -2px 4px rgba(0,0,0,0.4),
      0 2px 4px rgba(0,0,0,0.3);
    position: relative;
  }
  .dpad-center::before {
    content: '';
    position: absolute;
    top: 10%;
    left: 18%;
    width: 30%;
    height: 20%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
  }

  /* ===== BOTONES ARCADE A / B ===== */
  .snes-buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    pointer-events: auto;
  }
  .snes-row {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .snes-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto;
    transition: transform 0.06s, box-shadow 0.1s;
    position: relative;
    font-size: 20px;
    font-weight: 900;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .snes-btn::before {
    content: '';
    position: absolute;
    top: 10%;
    left: 18%;
    width: 32%;
    height: 22%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none;
  }
  .snes-btn:active {
    transform: scale(0.92) translateY(2px);
  }

  /* Botón A (Saltar) — Rojo arcade */
  #btn-jump {
    background: radial-gradient(circle at 35% 35%, #ff5252 0%, #f44336 40%, #b71c1c 100%);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(0,0,0,0.3),
      0 5px 10px rgba(244,67,54,0.4),
      0 0 18px rgba(244,67,54,0.25);
    color: #fff;
  }
  #btn-jump:active {
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.4),
      inset 0 -1px 2px rgba(255,255,255,0.2),
      0 1px 3px rgba(244,67,54,0.3);
  }

  /* Botón B (Correr) — Verde arcade */
  #btn-run {
    background: radial-gradient(circle at 35% 35%, #69f0ae 0%, #4caf50 40%, #1b5e20 100%);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(0,0,0,0.3),
      0 5px 10px rgba(76,175,80,0.4),
      0 0 18px rgba(76,175,80,0.25);
    color: #fff;
  }
  #btn-run:active {
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.4),
      inset 0 -1px 2px rgba(255,255,255,0.2),
      0 1px 3px rgba(76,175,80,0.3);
  }

  .snes-label {
    font-size: 9px;
    color: rgba(255, 255, 255, 0.65);
    text-align: center;
    margin-top: 3px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  /* ===== PANTALLAS ===== */
  #start-screen, #gameover-screen, #win-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(13,2,33,0.95);
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  #start-screen h1 {
    font-size: 32px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(255,0,255,0.5));
    letter-spacing: 2px;
  }
  #start-screen p { color: #ff69b4; margin-bottom: 12px; font-size: 14px; text-shadow: 0 0 8px rgba(255,105,180,0.4); }
  .character-list {
    display: flex;
    gap: 14px;
    margin: 4px 0 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .character-card {
    width: 130px;
    min-height: 190px;
    padding: 10px;
    border: 2px solid #4a1a6b;
    border-radius: 12px;
    background: linear-gradient(160deg, #1a0a2e, #0d0221);
    color: #e2e8f0;
    cursor: pointer;
    font: inherit;
    transition: transform .15s, border-color .15s, box-shadow .15s;
    touch-action: manipulation;
  }
  .character-card:hover:not(:disabled), .character-card.selected {
    transform: translateY(-3px);
    border-color: #ff00ff;
    box-shadow: 0 0 22px rgba(255,0,255,.35);
  }
  .character-card:disabled {
    opacity: .55;
    cursor: not-allowed;
    border-color: #2d1b4e;
  }
  .character-card:disabled .character-status {
    color: #64748b;
  }
  #character-preview, #arana-preview {
    display: block;
    width: 100px;
    height: 150px;
    margin: 0 auto 4px;
  }
  .character-name { display: block; font-weight: 800; font-size: 14px; }
  .character-status { display: block; margin-top: 2px; color: #ff69b4; font-size: 11px; }
  .future-avatar {
    display: grid;
    place-items: center;
    height: 150px;
    margin-bottom: 4px;
    border-radius: 8px;
    background: rgba(255,0,255,.06);
    color: #ff69b4;
    font-size: 40px;
  }
  .btn {
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    text-transform: uppercase;
    letter-spacing: 1px;
    touch-action: manipulation;
    margin: 4px;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: linear-gradient(135deg, #ff00ff, #8b008b);
    color: #fff;
    box-shadow: 0 4px 20px rgba(255,0,255,0.4);
    text-shadow: 0 0 8px rgba(255,255,255,0.3);
  }
  .btn-green {
    background: linear-gradient(135deg, #00ffff, #008b8b);
    color: #0d0221;
    box-shadow: 0 4px 20px rgba(0,255,255,0.4);
    font-weight: 800;
  }
  .screen-title { font-size: 30px; margin-bottom: 10px; color: #ff0040; text-shadow: 0 0 15px rgba(255,0,64,0.6); }
  .screen-sub { color: #ff69b4; margin-bottom: 16px; font-size: 15px; }
  #win-character-preview {
    display: block;
    width: 120px;
    height: 120px;
    margin: 8px auto;
    border-radius: 50%;
    border: 3px solid #ffd700;
    background: radial-gradient(circle at 40% 40%, #3d1b6e, #1a0a2e);
    box-shadow:
      inset 0 0 20px rgba(0,0,0,0.5),
      0 0 20px rgba(255,215,0,0.25),
      0 0 40px rgba(255,215,0,0.1);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .hidden { display: none !important; }

  /* ===== PANTALLA DE CARGA ===== */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0d0221;
    z-index: 50;
    overflow: hidden;
  }
  .loading-portada {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.35;
    filter: blur(2px) brightness(0.6);
  }
  .loading-overlay {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 30px;
  }
  .loading-title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #ffd700;
    text-shadow: 0 0 15px rgba(255,215,0,0.8), 0 0 40px rgba(255,0,255,0.4);
    animation: arcadePulse 2s ease-in-out infinite;
  }
  .loading-sub {
    font-size: 12px;
    color: #00ffff;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0,255,255,0.5);
  }
  .loading-bar {
    width: 220px;
    height: 10px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,0,255,0.4);
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 0 15px rgba(255,0,255,0.2);
  }
  .loading-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff00ff, #00ffff);
    border-radius: 3px;
    transition: width 0.3s ease;
    box-shadow: 0 0 15px rgba(0,255,255,0.6);
  }
  .loading-blink {
    font-size: 11px;
    color: #00ffff;
    letter-spacing: 5px;
    text-transform: uppercase;
    animation: blink 1s step-end infinite;
    text-shadow: 0 0 10px rgba(0,255,255,0.6);
  }
  @keyframes arcadePulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.03); opacity: 0.85; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ===== RESPONSIVE ===== */
  @media (max-height: 700px) {
    .dpad-btn { width: 48px; height: 48px; font-size: 15px; }
    .dpad-center { width: 48px; height: 48px; }
    .snes-btn { width: 54px; height: 54px; font-size: 16px; }
    #mobile-controls { padding: 10px 14px calc(18px + env(safe-area-inset-bottom)); }
  }
  @media (max-height: 600px) {
    .dpad-btn { width: 42px; height: 42px; font-size: 14px; }
    .dpad-center { width: 42px; height: 42px; }
    .snes-btn { width: 48px; height: 48px; font-size: 14px; }
    #mobile-controls { padding: 8px 12px calc(14px + env(safe-area-inset-bottom)); }
    #start-screen h1 { font-size: 26px; }
    .screen-title { font-size: 24px; }
  }
  @media (min-width: 500px) {
    #game-wrapper {
      height: 90vh;
      max-height: 900px;
      border-radius: 16px;
      box-shadow: 0 0 50px rgba(255,0,255,0.15);
    }
  }
  .win-title {
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 28px;
    color: #ffd700;
    text-shadow: 
      3px 3px 0 #b8860b,
      -1px -1px 0 #fff5cc,
      0 0 20px rgba(255, 215, 0, 0.6);
    margin-bottom: 4px;
    letter-spacing: 2px;
    animation: winPulse 1.5s ease-in-out infinite;
  }
  @keyframes winPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .win-stars {
    font-size: 18px;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    margin-bottom: 8px;
    animation: starTwinkle 1s ease-in-out infinite alternate;
  }
  @keyframes starTwinkle {
    from { opacity: 0.5; }
    to { opacity: 1; }
  }
  #win-screen .screen-sub {
    margin: 8px 0 4px;
  }
  #win-screen canvas {
    margin: 4px auto 8px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="game" width="400" height="640"></canvas>

  <div id="loading">
    <img class="loading-portada" src="assets/portada.jpeg" alt="Boka Aventura">
    <div class="loading-overlay">
      <div class="loading-title">🕹️ BOKA AVENTURA</div>
      <div class="loading-sub">EXTREME EDITION</div>
      <div class="loading-bar">
        <div class="loading-fill" id="loading-fill"></div>
      </div>
      <div class="loading-blink">INSERT COIN</div>
    </div>
  </div>

  <div id="ui-overlay">
    <span>🪙 <span id="score">0</span></span>
    <span>❤️ <span id="lives">3</span></span>
    <span>⏱️ <span id="time">300</span></span>
  </div>
  <button id="menu-button" class="hidden" type="button" onclick="returnToMenu()">☰ Menú</button>

  <div id="start-screen" class="hidden">
    <h1>🕹️ BOKA AVENTURA</h1>
    <p>EXTREME EDITION — Elige tu personaje</p>
    <div class="character-list" role="group" aria-label="Elegir personaje">
      <button class="character-card selected" id="character-tomy" type="button" onclick="selectCharacter('tomy')" aria-pressed="true">
        <canvas id="character-preview" width="100" height="150"></canvas>
        <span class="character-name">TOMY</span>
        <span class="character-status">Seleccionado</span>
      </button>
      <button class="character-card" id="character-arana" type="button" disabled title="Próximamente">
        <canvas id="arana-preview" width="100" height="150"></canvas>
        <span class="character-name">ARANA</span>
        <span class="character-status">Próximamente</span>
      </button>
    </div>
    <button class="btn btn-primary" onclick="startGame()">▶ Jugar</button>
  </div>

  <div id="gameover-screen" class="hidden">
    <div class="screen-title">💀 GAME OVER</div>
    <div class="screen-sub">Puntuación: <span id="final-score">0</span></div>
    <button class="btn btn-primary" onclick="restartGame()">↻ Reintentar</button>
    <button class="btn" onclick="returnToMenu()">☰ Menú</button>
  </div>

  <div id="win-screen" class="hidden">
    <div class="win-title">YOU WIN!</div>
    <div class="win-stars">✦ ✦ ✦</div>
    <div class="screen-sub">Puntuación: <span id="win-score">0</span></div>
    <canvas id="win-character-preview" width="120" height="600" aria-label="TOMY celebrando"></canvas>
    <button class="btn btn-green" onclick="restartGame()">↻ Jugar de nuevo</button>
    <button class="btn" onclick="returnToMenu()">☰ Menú</button>
  </div>

  <!-- CONTROLES MÓVILES ESTILO SNES -->
  <div id="mobile-controls" class="hidden">
    <div class="dpad">
      <div class="dpad-btn dpad-up" id="btn-up">▲</div>
      <div class="dpad-row">
        <div class="dpad-btn dpad-left" id="btn-left">◀</div>
        <div class="dpad-center"></div>
        <div class="dpad-btn dpad-right" id="btn-right">▶</div>
      </div>
      <div class="dpad-btn dpad-down" id="btn-down">▼</div>
    </div>
    <div class="snes-buttons">
      <div class="snes-row">
        <div class="snes-btn" id="btn-jump">
          A
          <span class="snes-label">Saltar</span>
        </div>
        <div class="snes-btn" id="btn-run">
          B
          <span class="snes-label">Correr</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1a">
<title>🧥 Aventura TOMY</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    background: #0a0a1a;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
  }
  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: #0a0a1a;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    flex: 1;
  }

  /* ===== UI SUPERIOR ===== */
  #ui-overlay {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: 700;
    text-shadow: 1px 1px 0 #000, 0 0 8px rgba(0,0,0,0.6);
    pointer-events: none;
    z-index: 10;
    background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
  }
  #ui-overlay span { display: flex; align-items: center; gap: 4px; }

  #menu-button {
    position: absolute;
    top: 42px;
    right: 10px;
    z-index: 15;
    padding: 6px 10px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 6px;
    background: rgba(15,23,42,.85);
    color: #fff;
    font: 700 12px 'Segoe UI', system-ui, sans-serif;
    cursor: pointer;
    touch-action: manipulation;
  }
  #menu-button:active { background: #1e293b; }

  /* ===== CONTROLES MÓVILES ===== */
  #mobile-controls {
    display: none;
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    justify-content: space-between;
    align-items: flex-end;
    padding: 12px 16px 24px;
    z-index: 30;
    pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,0.35), transparent);
  }
  .mobile-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.28);
    color: #fff;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: auto;
    transition: background 0.08s, transform 0.08s;
  }
  .mobile-btn:active {
    background: rgba(255,255,255,0.35);
    transform: scale(0.9);
  }
  .mobile-dpad { display: flex; gap: 12px; }

  /* ===== PANTALLAS ===== */
  #start-screen, #gameover-screen, #win-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.92);
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  #start-screen h1 {
    font-size: 32px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #dc2626, #f59e0b, #dc2626);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 16px rgba(220,38,38,0.5));
  }
  #start-screen p { color: #94a3b8; margin-bottom: 12px; font-size: 14px; }
  .character-list {
    display: flex;
    gap: 14px;
    margin: 4px 0 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .character-card {
    width: 130px;
    min-height: 190px;
    padding: 10px;
    border: 2px solid #334155;
    border-radius: 12px;
    background: linear-gradient(160deg, #172033, #0f172a);
    color: #e2e8f0;
    cursor: pointer;
    font: inherit;
    transition: transform .15s, border-color .15s, box-shadow .15s;
    touch-action: manipulation;
  }
  .character-card:hover:not(:disabled), .character-card.selected {
    transform: translateY(-3px);
    border-color: #f59e0b;
    box-shadow: 0 0 18px rgba(245,158,11,.3);
  }
  .character-card:disabled {
    opacity: .55;
    cursor: not-allowed;
    border-color: #1e293b;
  }
  .character-card:disabled .character-status {
    color: #64748b;
  }
  #character-preview, #arana-preview {
    display: block;
    width: 100px;
    height: 150px;
    margin: 0 auto 4px;
  }
  .character-name { display: block; font-weight: 800; font-size: 14px; }
  .character-status { display: block; margin-top: 2px; color: #94a3b8; font-size: 11px; }
  .future-avatar {
    display: grid;
    place-items: center;
    height: 150px;
    margin-bottom: 4px;
    border-radius: 8px;
    background: rgba(148,163,184,.1);
    color: #94a3b8;
    font-size: 40px;
  }
  .btn {
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    text-transform: uppercase;
    letter-spacing: 1px;
    touch-action: manipulation;
    margin: 4px;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: linear-gradient(135deg, #dc2626, #991b1b);
    color: #fff;
    box-shadow: 0 4px 16px rgba(220,38,38,0.4);
  }
  .btn-green {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    box-shadow: 0 4px 16px rgba(16,185,129,0.4);
  }
  .screen-title { font-size: 30px; margin-bottom: 10px; }
  .screen-sub { color: #94a3b8; margin-bottom: 16px; font-size: 15px; }
  #win-character-preview {
    display: block;
    width: 90px;
    height: 150px;
    margin: -6px auto 2px;
  }
  .hidden { display: none !important; }

  /* ===== LOADING ===== */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a1a;
    z-index: 50;
    font-size: 16px;
    color: #94a3b8;
  }


  /* ===== RESPONSIVE AJUSTES ===== */
  @media (max-height: 700px) {
    .mobile-btn { width: 58px; height: 58px; font-size: 22px; }
    #mobile-controls { padding: 8px 12px 16px; }
  }
  @media (max-height: 600px) {
    .mobile-btn { width: 52px; height: 52px; font-size: 20px; }
    #mobile-controls { padding: 6px 10px 12px; }
    #start-screen h1 { font-size: 26px; }
    .screen-title { font-size: 24px; }
  }
  @media (min-width: 500px) {
    #game-wrapper {
      height: 90vh;
      max-height: 900px;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(220,38,38,0.15);
    }
  }
  /* ===== PANTALLA ARCADE ===== */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a1a;
    z-index: 50;
  }
  .arcade-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px 30px;
    border: 4px solid #dc2626;
    border-radius: 20px;
    background: linear-gradient(180deg, #1a0a0a 0%, #0a0a1a 100%);
    box-shadow: 0 0 30px rgba(220,38,38,0.3), inset 0 0 60px rgba(220,38,38,0.05);
    min-width: 280px;
  }
  .arcade-logo {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #fbbf24;
    text-shadow: 0 0 10px rgba(251,191,36,0.8), 0 0 40px rgba(251,191,36,0.4);
    animation: arcadePulse 2s ease-in-out infinite;
  }
  .arcade-sub {
    font-size: 13px;
    color: #94a3b8;
    letter-spacing: 6px;
    text-transform: uppercase;
  }
  .arcade-bar {
    width: 200px;
    height: 12px;
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 4px;
  }
  .arcade-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #dc2626, #f59e0b);
    border-radius: 4px;
    transition: width 0.3s ease;
    box-shadow: 0 0 10px rgba(220,38,38,0.5);
  }
  .arcade-status {
    font-size: 12px;
    color: #64748b;
    font-family: monospace;
    letter-spacing: 2px;
  }
  .arcade-blink {
    font-size: 11px;
    color: #ef4444;
    letter-spacing: 4px;
    text-transform: uppercase;
    animation: blink 1s step-end infinite;
    margin-top: 4px;
  }
  @keyframes arcadePulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.03); opacity: 0.85; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  /* ===== LOADING SPINNER (eliminado, reemplazado por arcade) ===== */
  #loading-spinner { display: none; }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="game" width="400" height="640"></canvas>

  <div id="loading">
    <div class="arcade-screen">
      <div class="arcade-logo">🕹️ AVENTURA TOMY</div>
      <div class="arcade-sub">CARGANDO...</div>
      <div class="arcade-bar">
        <div class="arcade-fill" id="loading-fill"></div>
      </div>
      <div class="arcade-status" id="loading-status">0 / 5</div>
      <div class="arcade-blink">INSERT COIN</div>
    </div>
  </div>

  <div id="ui-overlay">
    <span>🪙 <span id="score">0</span></span>
    <span>❤️ <span id="lives">3</span></span>
    <span>⏱️ <span id="time">300</span></span>
  </div>
  <button id="menu-button" class="hidden" type="button" onclick="returnToMenu()">☰ Menú</button>

  <div id="start-screen" class="hidden">
    <h1>🧥 Aventura TOMY</h1>
    <p>Elige tu personaje</p>
    <div class="character-list" role="group" aria-label="Elegir personaje">
      <button class="character-card selected" id="character-tomy" type="button" onclick="selectCharacter('tomy')" aria-pressed="true">
        <canvas id="character-preview" width="100" height="150"></canvas>
        <span class="character-name">TOMY</span>
        <span class="character-status">Seleccionado</span>
      </button>
      <button class="character-card" id="character-arana" type="button" disabled title="Próximamente">
        <canvas id="arana-preview" width="100" height="150"></canvas>
        <span class="character-name">ARANA</span>
        <span class="character-status">Próximamente</span>
      </button>
    </div>
    <button class="btn btn-primary" onclick="startGame()">▶ Jugar</button>
  </div>

  <div id="gameover-screen" class="hidden">
    <div class="screen-title">💀 Game Over</div>
    <div class="screen-sub">Puntuación: <span id="final-score">0</span></div>
    <button class="btn btn-primary" onclick="restartGame()">↻ Reintentar</button>
    <button class="btn" onclick="returnToMenu()">☰ Menú</button>
  </div>

  <div id="win-screen" class="hidden">
    <div class="screen-title">🏆 ¡Victoria!</div>
    <canvas id="win-character-preview" width="90" height="150" aria-label="TOMY celebrando"></canvas>
    <div class="screen-sub">Puntuación: <span id="win-score">0</span></div>
    <button class="btn btn-green" onclick="restartGame()">↻ Jugar de nuevo</button>
    <button class="btn" onclick="returnToMenu()">☰ Menú</button>
  </div>

  <div id="mobile-controls" class="hidden">
    <div class="mobile-dpad">
      <div class="mobile-btn" id="btn-left">◀</div>
      <div class="mobile-btn" id="btn-right">▶</div>
    </div>
    <div class="mobile-btn" id="btn-jump">▲</div>
  </div>
</div>

<script src="js/game.js"></script>
</body>
</html>
